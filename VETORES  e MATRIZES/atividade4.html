<body>

    <h1>04 Faça um programa que leia 5 números inteiros e exiba quantos deles são pares.</h1>

    <script>

        let pares = 0;

        for (let i = 0; i < 5; i++){
            let numero = parseInt(prompt("Digite um numero inteiro"));
            
            if (numero %2 === 0)
            pares++ //
        }

        alert("A quantidade de numeros pares são: " + pares)



    </script>
    
</body>
