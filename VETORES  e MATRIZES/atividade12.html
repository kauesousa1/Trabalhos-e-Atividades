<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 12 VETORES</title>
</head>
<body>

    <h1>12 Crie um programa que leia 5 números inteiros e exiba-os em ordem decrescente.</h1>

    <script>

        let vetor = [];

        for (let i = 1; i <= 5; i++){
            let numeros = parseInt(prompt("Digite Um Numero Inteiro: "))
            vetor[i] = numeros
        }

        vetor.sort((a,b) => b - a);

        document.write("Aqui está os numeros em ordem decrescente: " + vetor)

    </script>
    
</body>
</html>
