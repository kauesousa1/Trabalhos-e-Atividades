<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 17 MATRIZ</title>
</head>
<body>

    <h1>17 Escreva um programa que leia uma matriz 2x2 de números inteiros e calcule a soma de todos os elementos.</h1>

    <script>

        let matriz  = [];                  // armazenar 
        let soma = 0;

        for(let i = 0; i < 2;i++){
            matriz[i] = [] // linha

            for(let j = 0; j < 2;j++){    // coluna
                matriz[i][j] = parseInt(prompt("Digite um numero:"))
                soma += matriz[i][j]
            }
        }
        
        document.write("A soma total é: " + soma);

        // no caso da soma, ela não precisa vir dentro do for!

    </script>
    
</body>
</html>
