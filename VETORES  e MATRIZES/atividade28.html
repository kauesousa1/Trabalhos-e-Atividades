<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>
        28 Faça um programa que leia uma matriz 4x4 de números inteiros e exiba o maior valor presente em cada linha.
    </h1>


    <script>

        let matriz = [];

        
        for (let i = 0; i < 4; i++) {
        matriz[i] = [];
        
        for (let j = 0; j < 4; j++) {
            matriz[i][j] = parseInt(prompt(`Digite o valor [${i}][${j}]:`));
        }
        }

       
        for (let i = 0; i < 4; i++) {
        let maior = matriz[i][0]; 

        for (let j = 1; j < 4; j++) {
            if (matriz[i][j] > maior) {
            maior = matriz[i][j];
            }
        }

        console.log(`Maior da linha ${i}: ${maior}`);
        }

    </script>
    
</body>
</html>
