<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 10 VETORES</title>
</head>
<body>

    <h1>10 Faça um programa que leia 5 números inteiros e verifique se algum deles é igual a zero.</h1>

    <script>

        let qntdZeros = 0;


        for (let i = 0; i < 5; i++){
            let numeros = parseInt(prompt("Digite Um Numero Inteiro: "));

            if(numeros === 0){
                qntdZeros++
            }
        }

        document.write("Esses são o total de numeros igual a zero: " + qntdZeros)

    </script>
    
</body>
</html>
