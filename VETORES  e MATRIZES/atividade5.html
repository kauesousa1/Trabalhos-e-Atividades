<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 5 VETORES</title>
</head>
<body>

    <h1></h1>
    

    <script>

        let inte = []; // usar quando for lista 

        for (let i = 0; i < 5; i++){
            let numero = parseInt(prompt("Digite um numero inteiro"));
            inte[i] = numero
        }

        inte.sort((a,b) => a - b);

        document.writeln(inte[4]); // line next 
        document.writeln(inte[0]);


    </script>
</body>
</html>
