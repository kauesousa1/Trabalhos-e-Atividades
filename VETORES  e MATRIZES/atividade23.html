<!DOCTYPE html>

<head>

<body>
    
    <h1>23 Escreva um programa que leia uma matriz 3x3 de números inteiros e exiba o menor valor presente na matriz.</h1>

    <script>
        let matriz = [];
        let menor;

        
        for (let i = 0; i < 3; i++) {
        matriz[i] = [];
        
        for (let j = 0; j < 3; j++) {
            let numero = parseInt(prompt(`Digite o valor [${i}][${j}]:`));
            matriz[i][j] = numero;

            
            if (i === 0 && j === 0) {
            menor = numero; 
            } else if (numero < menor) {
            menor = numero;
            }
        }
        }

        
        console.log("Menor valor da matriz:", menor);
        
    </script>

</body>
