<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 6 VETORES</title>
</head>
<body>

    <h1></h1>

    <script>

        let lista = [];

        for (let i = 0; i < 10; i++){
            let numero = parseInt(prompt("Digite um numero"));
            lista[i] = numero
        }

        lista.sort((a,b) => a - b);

        document.write("Aqui está os numeros que você digitou em ordem crescente!: " + lista)


    </script>
    
</body>
</html>
