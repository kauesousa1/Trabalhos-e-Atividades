<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 26 MATRIZES</title>
</head>
<body>

    <h1>26 Escreva um programa que leia duas matrizes 2x2 de números inteiros e verifique se elas são iguais.</h1>

    <script>

        let matriz1 = [];
        let matriz2 = [];
        let iguais = true;

        
        for (let i = 0; i < 2; i++) {
        matriz1[i] = [];
        for (let j = 0; j < 2; j++) {
            matriz1[i][j] = parseInt(prompt(`Matriz 1 [${i}][${j}]:`));
        }
        }

        
        for (let i = 0; i < 2; i++) {
        matriz2[i] = [];
        for (let j = 0; j < 2; j++) {
            matriz2[i][j] = parseInt(prompt(`Matriz 2 [${i}][${j}]:`));
        }
        }

        
        for (let i = 0; i < 2; i++) {
        for (let j = 0; j < 2; j++) {
            if (matriz1[i][j] !== matriz2[i][j]) {
            iguais = false;
            break;
            }
        }
        if (!iguais) break;
        }

       
        if (iguais) {
        console.log("As matrizes são iguais");
        } else {
        console.log("As matrizes são diferentes");
        }

    </script>
    
</body>
</html>
