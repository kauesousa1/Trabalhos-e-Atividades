<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 27 MATRIZES</title>
</head>
<body>

    <h1>27 Crie um programa que leia uma matriz 3x3 de números inteiros e exiba o produto dos elementos da diagonal secundária.</h1>

    <script>
        let matriz = [];
        let produto = 1;


        for (let i = 0; i < 3; i++) {
        matriz[i] = [];
        
        for (let j = 0; j < 3; j++) {
            matriz[i][j] = parseInt(prompt(`Digite o valor [${i}][${j}]:`));
        }
        }


        for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
            if (i + j === 2) {
            produto *= matriz[i][j];
            }
        }
        }

        console.log("Produto da diagonal secundária:", produto);
    </script>
    
</body>
</html>
