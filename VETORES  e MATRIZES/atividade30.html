<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 30 MATRIZES</title>
</head>
<body>

    <h1>30 Crie um programa que leia duas matrizes 2x2 de números inteiros e exiba a subtração</h1>

    <script>

        let A = [];
        let B = [];
        let R = [];

        
        for (let i = 0; i < 2; i++) {
        A[i] = [];
        for (let j = 0; j < 2; j++) {
            A[i][j] = parseInt(prompt(`A[${i}][${j}]:`));
        }
        }

       
        for (let i = 0; i < 2; i++) {
        B[i] = [];
        for (let j = 0; j < 2; j++) {
            B[i][j] = parseInt(prompt(`B[${i}][${j}]:`));
        }
        }

        
        for (let i = 0; i < 2; i++) {
        R[i] = [];
        for (let j = 0; j < 2; j++) {
            R[i][j] = A[i][j] - B[i][j];
        }
        }

        
        console.log("Matriz resultado (A - B):");

        for (let i = 0; i < 2; i++) {
        console.log(R[i].join(" "));
        }

    </script>
    
</body>
</html>
