    <script>

        let lista = [];

        for (let i = 0; i < 10; i++){
            let valor = parseInt(prompt("Digite um numero"));
            lista[i] = valor
        }

        let soma = 0;

        for (let j = 0; j < 10; j++){
            soma+=lista[j]
        }

        document.write(soma)

    </script>
