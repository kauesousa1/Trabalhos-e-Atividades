<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3</title>
</head>
<body>

    <h1>3 Crie um programa que exiba os números pares de 1 a 50 usando o loop "while". </h1>

    <script>
        let numero = 0;

        while (numero <= 50) {
            if (numero % 2 === 0) {
                document.write(numero + "<br>");
            }
        }
    </script>
    
</body>
</html>
