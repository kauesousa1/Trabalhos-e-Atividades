<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 8</title>
</head>
<body>
    <script>
        let numero = parseInt(prompt("Digite um numero inteiro: "))

        let a = 0;
        let b = 1;
        let resultado = "";

        while( a <= numero) {
            resultado+= a +" ";
            let temp = a;
            a = b;
            b = temp + b;
        }

        alert("Sequência de fiboanacci até " + numero + ":\n" + resultado);

    </script>
    
</body>
</html>
