<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 9</title>
</head>
<body>

    <h1>9 Crie um programa que leia o nome e a idade de 5 pessoas usando o loop "while" e exiba a média das idades.</h1>
    
    <script>
        let nomes = [];
        let idades = [];
        let contador = 0;

        while (contador < 5){
            let nome = prompt("Insira seu nome: ");
            nomes.push(nome);
            
            let idade = parseInt(prompt("Insira sua idade: "));
            idades.push(idade);
            
            contador++;
        }

        let soma = 0;
        for (let i = 0; i < idades.length; i++) {
            soma += idades[i];
        }

        let media = soma / 5;

        document.write("A média das idades é: " + media);

    </script>

</body>
</html>
