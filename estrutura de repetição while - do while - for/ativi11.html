<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 11</title>
</head>
<body>
    
    <script>
        let numero = parseInt(prompt("Digite um número inteiro: "))
        let i = 0;
        let soma = 0;

        while ( i <= numero){
            soma = soma + i;
            i = i + 2;
        }
        document.write("A soma de todos os numeros pares é: " + soma);

    </script>
</body>
</html>
