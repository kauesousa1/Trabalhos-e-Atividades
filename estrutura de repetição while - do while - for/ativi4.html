<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4</title>
</head>
<body>

    <h1>4 Faça um programa que leia 5 números inteiros usando o loop "while" e exiba a média aritmética dos valores lidos. </h1>

    <script>
  
        let contador = 0;
        let soma = 0;
        function soma (a,b) {
            return a+b
        }

        while (contador < 5) {
            let numero = parseInt(prompt("Digite um número inteiro:"));
            soma += numero;
            contador++;
        }

        let media = soma / 5;
        document.write("A média aritmética dos números digitados é: " + media);
    </script>
    
</body>
</html>
