<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 7</title>
</head>
<body>
    <h1>7 Faça um programa que leia um número inteiro e exiba se ele é um número primo usando o loop "while". </h1>

    <script>
        let numero = parseInt(prompt("digite um número intero: "));
        let i = 2;
        let primo = true;

        if (primo <= 1){
            primo = false;
        }else {
            while (i < numero ){
                if (numero % i === 0) {
                    primo = false;
                    break;
                }
                i++;
            }
        }
        

    </script>
    
</body>
</html>
